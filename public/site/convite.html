<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0d1017">
<title>Convite — MarQGol</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700;800&family=Bebas+Neue&display=swap">
<link rel="stylesheet" href="/comum/ui.css">
<link rel="stylesheet" href="/comum/site.css">
</head>
<body class="site">
<header class="site-topo"><a class="marca" href="/" aria-label="MarQGol"><svg class="marca-icone" viewBox="0 0 30 22" aria-hidden="true"><rect x="1" y="1" width="28" height="20" rx="4"/><path d="M11 8l8 6M19 8l-8 6"/></svg>Mar<span>Q</span>Gol</a></header>
<main class="caixa-form">
  <section class="cartao">
    <h1>Aceitar convite</h1>
    <p id="quem">Conferindo o convite…</p>
    <div id="msg" hidden></div>
    <form id="form" novalidate hidden>
      <div><label class="rotulo" for="senha">Crie sua senha (mín. 8 caracteres)</label><input class="campo" id="senha" type="password" autocomplete="new-password" minlength="8" required></div>
      <div><label class="rotulo" for="senha2">Repita a senha</label><input class="campo" id="senha2" type="password" autocomplete="new-password" required></div>
      <button class="btn grande marca-btn" type="submit" id="enviar">Criar senha e entrar</button>
    </form>
  </section>
</main>
<script src="/comum/ui.js"></script>
<script src="/comum/marq.js"></script>
<script>
const token = new URLSearchParams(location.search).get('token') || '';
const msg = document.getElementById('msg');
function mostrar(t) { msg.className = 'erro-form'; msg.textContent = t; msg.hidden = false; }
MARQ.api('GET', '/api/auth/convite?token=' + encodeURIComponent(token)).then(c => {
    document.getElementById('quem').innerHTML = `Olá, <b>${esc(c.nome)}</b>! Você foi convidado para os placares de <b>${esc(c.cliente)}</b>. Seu login será <b>${esc(c.email)}</b>.`;
    document.getElementById('form').hidden = false;
}).catch(e => {
    document.getElementById('quem').textContent = '';
    mostrar(e.message + ' Peça ao administrador da conta para reenviar o convite.');
});
document.getElementById('form').addEventListener('submit', async (ev) => {
    ev.preventDefault();
    const s1 = document.getElementById('senha').value, s2 = document.getElementById('senha2').value;
    if (s1 !== s2) return mostrar('As senhas não são iguais.');
    const btn = document.getElementById('enviar');
    btn.disabled = true;
    try {
        const r = await MARQ.api('POST', '/api/auth/aceitar-convite', { token, senha: s1 });
        location.href = r.destino;
    } catch (e) { mostrar(e.message); btn.disabled = false; }
});
</script>
</body>
</html>
