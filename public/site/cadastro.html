<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0d1017">
<title>Criar conta — MarQGol</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700;800&family=Bebas+Neue&display=swap">
<link rel="stylesheet" href="/comum/ui.css">
<link rel="stylesheet" href="/comum/site.css">
</head>
<body class="site">
<header class="site-topo"><a class="marca" href="/" aria-label="MarQGol"><svg class="marca-icone" viewBox="0 0 30 22" aria-hidden="true"><rect x="1" y="1" width="28" height="20" rx="4"/><path d="M11 8l8 6M19 8l-8 6"/></svg>Mar<span>Q</span>Gol</a><nav><a class="btn leve" href="/entrar">Já tenho conta</a></nav></header>
<main class="caixa-form larga">
  <section class="cartao">
    <h1>Teste grátis por <span id="dias">14</span> dias</h1>
    <p>Sem cartão. Monte o plano do seu jeito: durante o teste você usa tudo o que escolher e, no fim, decide se assina. Dá para mudar depois.</p>
    <div id="msg" hidden></div>
    <form id="form" novalidate>
      <div>
        <span class="rotulo">Seu plano</span>
        <div id="montador"><span class="vazio">Carregando…</span></div>
      </div>
      <div class="grade-2">
        <div><label class="rotulo" for="nomeCliente">Clube, escola ou organização</label><input class="campo" id="nomeCliente" maxlength="120" required></div>
        <div><label class="rotulo" for="documento">CPF ou CNPJ</label><input class="campo" id="documento" inputmode="numeric" maxlength="18" required placeholder="Para a cobrança, se assinar"></div>
      </div>
      <div class="grade-2">
        <div><label class="rotulo" for="nome">Seu nome</label><input class="campo" id="nome" autocomplete="name" maxlength="120" required></div>
        <div><label class="rotulo" for="telefone">Celular (opcional)</label><input class="campo" id="telefone" type="tel" autocomplete="tel" maxlength="20"></div>
      </div>
      <div class="grade-2">
        <div><label class="rotulo" for="email">E-mail</label><input class="campo" id="email" type="email" autocomplete="email" required></div>
        <div><label class="rotulo" for="senha">Senha (mín. 8 caracteres)</label><input class="campo" id="senha" type="password" autocomplete="new-password" minlength="8" required></div>
      </div>
      <label class="check"><input type="checkbox" id="aceite" required><span>Li e aceito os <a href="/termos" target="_blank" style="color:var(--fg)">Termos de uso e a Política de privacidade</a>. Entendo que sou responsável pelos dados dos atletas que cadastrar (nomes, fotos e vídeos), inclusive pela autorização dos responsáveis no caso de menores.</span></label>
      <button class="btn grande marca-btn" type="submit" id="enviar">Criar conta e começar</button>
    </form>
  </section>
</main>
<script src="/comum/ui.js"></script>
<script src="/comum/marq.js"></script>
<script src="/comum/montador.js"></script>
<script>
const q = new URLSearchParams(location.search);
const msg = document.getElementById('msg');
function mostrar(texto) { msg.className = 'erro-form'; msg.textContent = texto; msg.hidden = false; msg.scrollIntoView({ block: 'nearest' }); }

// Plano montado na página inicial chega pela URL; senão, 1 placar com mídia.
let montador = null;
MARQ.api('GET', '/api/publico/precos').then(tabela => {
    document.getElementById('dias').textContent = tabela.dias_teste;
    montador = MONTADOR.criar(document.getElementById('montador'), {
        tabela, composicao: MONTADOR.daUrl(q) || { placares: 1, recursos: { midia: true } }
    });
}).catch(() => { document.getElementById('montador').innerHTML = '<span class="vazio">Não foi possível carregar os preços. Recarregue a página.</span>'; });

// Máscara simples de CPF/CNPJ (só para leitura; o servidor guarda dígitos).
document.getElementById('documento').addEventListener('input', (e) => {
    const d = e.target.value.replace(/\D/g, '').slice(0, 14);
    e.target.value = d.length <= 11
        ? d.replace(/(\d{3})(\d)/, '$1.$2').replace(/(\d{3})(\d)/, '$1.$2').replace(/(\d{3})(\d{1,2})$/, '$1-$2')
        : d.replace(/^(\d{2})(\d)/, '$1.$2').replace(/^(\d{2})\.(\d{3})(\d)/, '$1.$2.$3').replace(/\.(\d{3})(\d)/, '.$1/$2').replace(/(\d{4})(\d)/, '$1-$2');
});

document.getElementById('form').addEventListener('submit', async (ev) => {
    ev.preventDefault();
    if (!document.getElementById('aceite').checked) return mostrar('Para criar a conta, aceite os termos de uso.');
    const v = (id) => document.getElementById(id).value;
    const btn = document.getElementById('enviar');
    btn.disabled = true;
    msg.hidden = true;
    try {
        if (!montador) throw new Error('Os preços ainda não carregaram. Recarregue a página.');
        const r = await MARQ.api('POST', '/api/auth/cadastro', {
            composicao: montador.composicao(),
            nomeCliente: v('nomeCliente'), documento: v('documento'), telefone: v('telefone'),
            nome: v('nome'), email: v('email'), senha: v('senha')
        });
        location.href = r.destino + '?bemvindo=1';
    } catch (e) {
        mostrar(e.message);
        btn.disabled = false;
    }
});
</script>
</body>
</html>
