<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0d1017">
<title>Parear TV — MarQGol</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;600&family=Barlow+Condensed:wght@800&family=Bebas+Neue&display=swap">
<style>
/* Página que a TV abre UMA vez: mostra um código para alguém digitar no
   celular/tablet já logado. Depois de pareada, /telao leva direto ao placar.
   Medidas em vmin: a mesma página serve de TV de 32" a projetor. */
:root { color-scheme: dark; }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  font-family: "Barlow", system-ui, sans-serif; color: #f4f3ef;
  background: radial-gradient(ellipse at 50% 38%, #2a1418 0%, #0d1017 60%, #05070b 100%);
  display: grid; place-items: center; overflow: hidden; cursor: none;
}
main { text-align: center; padding: 4vmin; width: min(1100px, 100%); }
.marca { font-family: "Barlow Condensed", "Arial Narrow", sans-serif; font-weight: 800; font-size: 8vmin; letter-spacing: .01em; margin: 0 0 3vmin; }
.marca span { color: #ff4d5e; }
.instrucao { font-size: 3.2vmin; line-height: 1.4; color: #b9c0cc; margin: 0 auto 4vmin; max-width: 80vmin; }
.instrucao b { color: #fff; }
.codigo { display: flex; justify-content: center; gap: 1.6vmin; margin: 0 0 4vmin; }
.codigo span {
  font-family: "Bebas Neue", Impact, sans-serif; font-size: 17vmin; line-height: 1;
  width: 13vmin; padding: 2vmin 0 1vmin; border-radius: 2.2vmin;
  background: #13161d; border: .5vmin solid #2a3140;
}
.codigo span:nth-child(3) { margin-right: 3vmin; }
.passos { display: flex; justify-content: center; gap: 4vmin; font-size: 2.4vmin; color: #9aa2b0; margin-bottom: 3vmin; flex-wrap: wrap; }
.passos div { max-width: 26vmin; }
.passos b { display: block; color: #ffb020; font-family: "Bebas Neue", Impact, sans-serif; font-size: 4vmin; }
.rodape { font-size: 2vmin; color: #5a606b; }
.ok { font-family: "Bebas Neue", Impact, sans-serif; font-size: 10vmin; color: #22c55e; }
.erro { color: #ffb4b4; font-size: 3vmin; }
</style>
</head>
<body>
<main>
  <h1 class="marca">Mar<span>Q</span>Gol</h1>
  <div id="conteudo">
    <p class="instrucao">Preparando o código de pareamento…</p>
  </div>
</main>
<script>
// Fluxo: pede um código (POST /api/telas/codigo), mostra, e consulta a cada
// 2 s se alguém já o digitou. Pareada, a TV recebe um cookie de leitura e vai
// para o placar. O código vence em 10 min: aí pede outro sozinho.
const conteudo = document.getElementById('conteudo');
const site = location.host;
let consulta = null;

async function api(metodo, url) {
    const r = await fetch(url, { method: metodo, headers: { 'X-MarQ': '1' }, credentials: 'same-origin' });
    const dado = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(dado.erro || `Erro ${r.status}`);
    return dado;
}

function mostrarCodigo(codigo) {
    conteudo.innerHTML = `
      <p class="instrucao">Para ligar esta TV a um placar, entre em <b>${site}</b> no celular ou tablet,
      vá em <b>Placares → Parear TV</b> e digite o código:</p>
      <div class="codigo" aria-label="Código ${codigo.split('').join(' ')}">${codigo.split('').map(d => `<span>${d}</span>`).join('')}</div>
      <div class="passos">
        <div><b>1</b>Entre na sua conta</div>
        <div><b>2</b>Placares → Parear TV</div>
        <div><b>3</b>Digite o código e escolha o placar</div>
      </div>
      <p class="rodape">O código muda a cada 10 minutos. Só é preciso parear uma vez.</p>`;
}

async function novoCodigo() {
    clearInterval(consulta);
    try {
        const { codigo } = await api('POST', '/api/telas/codigo');
        mostrarCodigo(codigo);
        consulta = setInterval(verificar, 2000);
    } catch (e) {
        conteudo.innerHTML = `<p class="erro">Não foi possível gerar o código (${e.message}). Tentando de novo…</p>`;
        setTimeout(novoCodigo, 10000);
    }
}

async function verificar() {
    try {
        const st = await api('GET', '/api/telas/codigo/status');
        if (st.estado === 'pareado') {
            clearInterval(consulta);
            conteudo.innerHTML = '<p class="ok">TV pareada!</p><p class="instrucao">Abrindo o placar…</p>';
            setTimeout(() => { location.href = st.destino; }, 1200);
        } else if (st.estado === 'expirado') {
            novoCodigo();
        }
    } catch { /* rede oscilando: tenta na próxima volta */ }
}

novoCodigo();
</script>
</body>
</html>
