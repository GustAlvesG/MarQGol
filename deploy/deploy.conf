SLUG="marqgol"                          # = name: do docker-compose.prod.yml (não mude depois do 1º deploy)
DOMAIN_VARS="DOMAIN"
REQUIRED_VARS="DOMAIN DB_PASSWORD SESSION_SECRET SUPERADMIN_EMAIL SUPERADMIN_SENHA"
SECRET_VARS="DB_PASSWORD SESSION_SECRET SUPERADMIN_SENHA ASAAS_WEBHOOK_TOKEN"
